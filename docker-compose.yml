# AgentCrucible full stack
#
#   frontend  nginx serving the Next.js site + dashboard, proxies /api → backend   http://localhost:8080
#   backend   `crucible serve`: runs, audits, reports (FastAPI)                     http://localhost:8000
#   db        Postgres 16: run and audit history
#   models    Ollama model server (agent, user simulator and judge)                 http://localhost:11435
#   models-init  one-shot: pulls CRUCIBLE_MODEL into the models service if it is missing
#
#   CRUCIBLE_PROJECT=coding-agent docker compose up   serves the coding-agent example instead
#
#   docker compose up --build                                   # CPU
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up --build   # NVIDIA GPU
#
# Settings come from .env (see .env.example).

name: agentcrucible

x-db-env: &db-env
  POSTGRES_USER: ${POSTGRES_USER:-crucible}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-crucible}
  POSTGRES_DB: ${POSTGRES_DB:-crucible}

services:
  db:
    image: postgres:16-alpine
    environment: *db-env
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # Redis for the agents under test: every episode gets one of its numbered databases, emptied before and after.
  # Nothing is persisted; it holds only test data.
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  models:
    image: ollama/ollama:${OLLAMA_VERSION:-0.17.1}
    # Point OLLAMA_MODELS_DIR at an existing Ollama models folder to reuse downloaded models.
    volumes:
      - ${OLLAMA_MODELS_DIR:-ollama-models}:/root/.ollama/models
    environment:
      OLLAMA_KEEP_ALIVE: 30m
      OLLAMA_NUM_PARALLEL: "2"
    ports:
      - "11435:11434"   # 11435 on the host so it doesn't clash with a local Ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  models-init:
    image: ollama/ollama:${OLLAMA_VERSION:-0.17.1}
    depends_on:
      models: { condition: service_healthy }
    environment:
      OLLAMA_HOST: http://models:11434
      CRUCIBLE_MODEL: ${CRUCIBLE_MODEL:-qwen2.5:7b}
    # instant when the model is already in OLLAMA_MODELS_DIR
    entrypoint: ["/bin/sh", "-c", "ollama pull $${CRUCIBLE_MODEL}"]
    restart: "no"

  backend:
    build: .
    image: agentcrucible:0.2.0
    command: ["serve", "--host", "0.0.0.0", "--port", "8000"]
    # which project the dashboard serves: support-agent (stdio + SQLite) or coding-agent (http + Anthropic + repos)
    working_dir: /workspace/examples/${CRUCIBLE_PROJECT:-support-agent}
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-crucible}:${POSTGRES_PASSWORD:-crucible}@db:5432/${POSTGRES_DB:-crucible}
      CRUCIBLE_LLM_URL: http://models:11434/v1
      CRUCIBLE_MODEL: ${CRUCIBLE_MODEL:-qwen2.5:7b}
      CRUCIBLE_HELPER_MODEL: ${CRUCIBLE_MODEL:-qwen2.5:7b}
      # Postgres fixtures: a fresh database per episode is created (and dropped) on this server
      CRUCIBLE_POSTGRES_URL: ${CRUCIBLE_POSTGRES_URL:-postgresql://${POSTGRES_USER:-crucible}:${POSTGRES_PASSWORD:-crucible}@db:5432/${POSTGRES_DB:-crucible}}
      # Redis for agents that use it: each episode gets its own empty numbered database on this server
      CRUCIBLE_REDIS_URL: ${CRUCIBLE_REDIS_URL:-redis://redis:6379}
      # Dashboard/API access. Empty = open (fine on your own machine); set before exposing the port.
      CRUCIBLE_API_TOKEN: ${CRUCIBLE_API_TOKEN:-}
      CRUCIBLE_VIEWER_TOKEN: ${CRUCIBLE_VIEWER_TOKEN:-}
      # Import codebase: folders the dashboard may read (your code is mounted at /import)
      CRUCIBLE_DISCOVER_ROOTS: /import:/workspace
      # so a path pasted from the host (D:\code\my-repo) is found at /import/my-repo
      CRUCIBLE_PATH_MAP: ${CRUCIBLE_IMPORT_DIR:-}=/import
      # optional: describe imported code with Claude or OpenAI instead of the local model (or paste a key in the import)
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    volumes:
      - results:/workspace/examples/${CRUCIBLE_PROJECT:-support-agent}/.crucible
      # the folder holding the repositories you want to import; approved tests are written into them (agent-tests/)
      - ${CRUCIBLE_IMPORT_DIR:-./examples}:/import
      # Python environments built for imported projects (Setup → Install dependencies): survive rebuilds
      - envs:/home/runner/.cache/agentcrucible/envs
    ports:
      - "8000:8000"
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
      models-init: { condition: service_completed_successfully }
    restart: unless-stopped

  frontend:
    build:
      context: ./website
      args: { NEXT_PUBLIC_BUG_REPORT_KEY: "${BUG_REPORT_KEY:-}" }
    image: agentcrucible-web:0.2.0
    ports:
      - "8080:80"
    depends_on:
      backend: { condition: service_healthy }
    restart: unless-stopped

volumes:
  pgdata:
  results:
    name: agentcrucible_results_${CRUCIBLE_PROJECT:-support-agent}   # one results volume per project
  ollama-models:
  envs:
