spring:
  application:
    name: support-assistant
  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        options:
          model: gpt-4o-mini
          temperature: 0.2
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/shop
    username: ${DB_USER:shop}
    password: ${DB_PASSWORD}
  mail:
    host: smtp.postmarkapp.com
    port: 587
    username: ${POSTMARK_TOKEN}
    password: ${POSTMARK_TOKEN}

carrier:
  base-url: https://api.easypost.com/v2
  api-key: ${EASYPOST_API_KEY}
