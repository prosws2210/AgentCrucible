[project]
name = "agentcrucible"
version = "0.1.0"
description = "Regression testing for AI agents and MCP servers: sandboxed episodes, trajectory checks, calibrated judges and statistically sound comparisons."
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Shakti Swaroop Sahu" }]
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "pydantic>=2.7",
    "pyyaml>=6",
    "httpx>=0.27",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "mcp>=1.9,<2",
    "numpy>=1.26",
    "scipy>=1.12",
    "jsonschema>=4.21",
]

[project.optional-dependencies]
examples = ["openai>=1.40"]

[project.scripts]
crucible = "agentcrucible.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5", "openai>=1.40"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentcrucible"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501", "B008"]
