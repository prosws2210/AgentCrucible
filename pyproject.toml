[project]
name = "agentcrucible"
dynamic = ["version"]
description = "Regression testing for AI agents and MCP servers: sandboxed episodes, trajectory checks, calibrated judges and statistically sound comparisons."
readme = "README.md"
license = "FSL-1.1-ALv2"
authors = [{ name = "Shakti Swaroop Sahu" }]
requires-python = ">=3.11"
keywords = ["ai-agents", "llm", "evaluation", "regression-testing", "mcp", "model-context-protocol", "llmops"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "pydantic>=2.7",
    "pyyaml>=6",
    "httpx>=0.27",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "mcp>=1.9,<2",
    "numpy>=1.26",
    "scipy>=1.12",
    "jsonschema>=4.21",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "tree-sitter>=0.23",
    "tree-sitter-typescript>=0.23",
    "tree-sitter-javascript>=0.23",
    "tree-sitter-go>=0.23",
    "tree-sitter-java>=0.23",
    "pathspec>=0.12",
]

[project.urls]
Homepage = "https://prosws2210.github.io/AgentCrucible/"
Repository = "https://github.com/prosws2210/AgentCrucible"
Documentation = "https://github.com/prosws2210/AgentCrucible/blob/main/docs/ADOPTION.md"
Changelog = "https://github.com/prosws2210/AgentCrucible/blob/main/CHANGELOG.md"
Issues = "https://github.com/prosws2210/AgentCrucible/issues"

[project.optional-dependencies]
examples = ["openai>=1.40", "anthropic>=2.3", "pytest>=8"]

[project.scripts]
crucible = "agentcrucible.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5", "openai>=1.40", "anthropic>=2.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/agentcrucible/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/agentcrucible"]

[tool.hatch.build.targets.sdist]
include = ["src/agentcrucible", "README.md", "LICENSE", "CHANGELOG.md", "pyproject.toml"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["tests/discover_corpus", "examples/import-demo/agent-tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501", "B008"]
