name: Release

# Push a tag like v0.2.0 to publish:
#   - wheel + sdist attached to a GitHub Release (notes taken from CHANGELOG.md)
#   - Docker images ghcr.io/<owner>/agentcrucible and agentcrucible-web, tagged with the version and `latest`
#   - PyPI, once trusted publishing is configured (set repository variable PUBLISH_PYPI=true)

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Check the tag matches the package version
        id: v
        run: |
          pkg=$(grep -oP '__version__ = "\K[^"]+' src/agentcrucible/__init__.py)
          tag="${GITHUB_REF_NAME#v}"
          [ "$pkg" = "$tag" ] || { echo "tag $tag != package $pkg"; exit 1; }
          echo "version=$pkg" >> "$GITHUB_OUTPUT"
      - run: uv sync
      - run: uv run ruff check src tests
      - run: uv run pytest -q
      - run: uv build
      - name: Smoke-test the wheel in a clean environment
        run: |
          python -m venv /tmp/wheel-env
          /tmp/wheel-env/bin/pip install -q dist/*.whl
          /tmp/wheel-env/bin/crucible version | grep "${{ steps.v.outputs.version }}"
      - uses: actions/upload-artifact@v4
        with: { name: dist, path: dist }

  github-release:
    needs: build
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: dist, path: dist }
      - name: Release notes from CHANGELOG.md
        run: awk "/^## \\[${{ needs.build.outputs.version }}\\]/{f=1;next} /^## \\[/{f=0} f" CHANGELOG.md > notes.md
      - env: { GH_TOKEN: "${{ github.token }}" }
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "AgentCrucible $GITHUB_REF_NAME" --notes-file notes.md

  docker:
    needs: build
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ github.token }}" }
      - name: Build and push
        env:
          V: ${{ needs.build.outputs.version }}
          IMG: ghcr.io/${{ github.repository_owner }}
        run: |
          IMG=$(echo "$IMG" | tr '[:upper:]' '[:lower:]')
          docker build -t "$IMG/agentcrucible:$V" -t "$IMG/agentcrucible:latest" .
          docker build -t "$IMG/agentcrucible-web:$V" -t "$IMG/agentcrucible-web:latest" website
          for t in agentcrucible:$V agentcrucible:latest agentcrucible-web:$V agentcrucible-web:latest; do docker push "$IMG/$t"; done

  pypi:
    needs: build
    if: vars.PUBLISH_PYPI == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions: { id-token: write }
    steps:
      - uses: actions/download-artifact@v4
        with: { name: dist, path: dist }
      - uses: pypa/gh-action-pypi-publish@release/v1
