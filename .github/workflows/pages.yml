name: Website

# Lints and builds the site on every change. The site itself is hosted on Vercel; publishing to GitHub Pages is
# opt-in: enable Pages (Settings → Pages → Source: GitHub Actions) and set the repository variable
# DEPLOY_PAGES=true.

on:
  push:
    branches: [main]
    paths: ["website/**", ".github/workflows/pages.yml"]
  pull_request:
    paths: ["website/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
        env:
          # GitHub Pages serves the site at https://<owner>.github.io/<repo>/
          NEXT_PUBLIC_BASE_PATH: ${{ vars.DEPLOY_PAGES == 'true' && format('/{0}', github.event.repository.name) || '' }}
      - if: vars.DEPLOY_PAGES == 'true' && github.event_name != 'pull_request'
        run: touch out/.nojekyll
      - if: vars.DEPLOY_PAGES == 'true' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: website/out

  deploy:
    needs: build
    if: vars.DEPLOY_PAGES == 'true' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
