apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "agentcrucible.fullname" . }}-results
  labels: {{- include "agentcrucible.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep   # results survive `helm uninstall`
spec:
  accessModes: [ReadWriteOnce]
  {{- with .Values.results.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.results.size }}
